<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الدفع بـ Pi - MONEEB GLOBAL</title>
<script src="https://sdk.minepi.com/pi-sdk.js"></script>
<style>
body{margin:0;font-family:Arial;background:#f6f6f6;direction:rtl;text-align:center}
.header{background:#0f3d1e;color:#fff;padding:12px}
.header h2{margin:0;color:#f5c542}
.box{background:#fff;margin:15px;padding:20px;border-radius:15px}
.pi{font-size:50px}
.btn{width:100%;background:#7b2ff7;color:#fff;border:none;padding:15px;border-radius:30px;font-size:18px;margin-top:10px}
.nav{position:fixed;bottom:0;width:100%;background:#fff;display:flex;justify-content:space-around;padding:12px 0;border-top:1px solid #ddd}
.nav a{text-decoration:none;color:#0f3d1e;font-weight:bold}
</style>
</head>
<body>
<div class="header"><h2>الدفع الآمن بـ Pi</h2></div>
<div class="box">
<div class="pi">π</div>
<h2>إجمالي الطلب</h2>
<h1 style="color:#7b2ff7">23 Pi</h1>
<p>سمسم القضارف + كركدي - شامل الشحن</p>
<p>الدفع عن طريق Pi Wallet</p>
<button class="btn" onclick="payPi()">تأكيد الدفع بـ Pi</button>
<button class="btn" style="background:#f5c542;color:#000" onclick="location.href='tracking.html'">شاهد التتبع التجريبي</button>
</div>
<br><br>
<div class="nav"><a href="home.html">🏠 الرئيسية</a><a href="cart.html">🛒 السلة</a><a href="tracking.html">📦 التتبع</a><a href="account.html">👤 حسابي</a></div>
<script>
function payPi(){
  Pi.init({version:"2.0"});
  Pi.createPayment({amount:23,memo:"طلب PiHarvest - سمسم وكركدي",metadata:{order:"123"}},{
    onReadyForServerApproval:function(id){alert("تم إنشاء الدفع: "+id);},
    onReadyForServerCompletion:function(id,tx){alert("تم الدفع بنجاح!");location.href='tracking.html';},
    onCancel:function(){alert("تم إلغاء الدفع");},
    onError:function(e){alert("خطأ: "+e);}
  });
}
</script>
</body>
</html>
