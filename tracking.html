<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>تتبع الطلب</title>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#f5f5f5;padding-bottom:80px}.header{background:#1a4d1a;color:#FFD700;text-align:center;padding:15px;font-weight:bold}.card{background:white;margin:12px;border-radius:12px;padding:15px}.status{color:#1a4d1a;font-weight:bold}.nav{position:fixed;bottom:0;left:0;right:0;background:white;display:flex;justify-content:space-around;padding:12px 0;border-top:1px solid #ddd}.nav a{text-decoration:none;color:#333;font-size:13px;text-align:center}</style>
</head>
<body>
<div class="header">📦 تتبع الطلبات</div>
<div id="list"></div>
<div class="nav"><a href="home.html">🏠<br>الرئيسية</a><a href="cart.html">🛒<br>السلة</a><a href="tracking.html">📦<br>التتبع</a><a href="account.html">👤<br>حسابي</a></div>
<script>
let orders=JSON.parse(localStorage.getItem('orders')||'[]');
let list=document.getElementById('list');
if(!orders.length){list.innerHTML='<p style="text-align:center;padding:30px">لا توجد طلبات بعد<br>اطلب من الرئيسية وارجع هنا</p>'}
orders.slice().reverse().forEach(o=>{
let names=o.items.map(i=>i.name+' (x'+(i.qty||1)+')').join('<br>');
list.innerHTML+=`<div class="card"><b>طلب: ${o.id}</b><br><small>${o.date}</small><br><br>${names}<br><br><div class="row">الإجمالي: <b>${o.total} Pi</b></div><div class="status">✅ تم الاستلام - قيد التجهيز</div><div>📍 القضارف → الخرطوم</div></div>`;
});
</script>
</body></html>
