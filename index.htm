<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MONEEB GLOBAL - PiHarvest</title>
<script src="https://sdk.minepi.com/pi-sdk.js"></script>
<style>
body{margin:0;font-family:Arial;background:#0f3d1e;color:#fff;text-align:center}
.logo{width:140px;margin-top:40px;border-radius:20px}
h1{color:#f5c542;font-size:32px;margin:10px}
p{color:#eee}
.btn{background:#7b2ff7;color:#fff;border:none;padding:15px 40px;border-radius:30px;font-size:18px;margin-top:20px;cursor:pointer}
.footer{margin-top:40px;font-size:14px;opacity:.8}
</style>
</head>
<body>
<img src="logo.png" class="logo">
<h1>حبة سمسم تسوى دهب</h1>
<p>منصة المحاصيل السودانية - القضارف</p>
<p>سمسم القضارف | كركدي | فول سوداني</p>
<button class="btn" onclick="loginPi()">ادخل بـ Pi</button>
<div class="footer">MONEEB GLOBAL - moneebglobal</div>
<script>
function loginPi(){
  Pi.init({version:"2.0"});
  Pi.authenticate(['username','payments'], function(auth){
    alert("مرحب بيك " + auth.user.username);
    window.location.href="home.html";
  });
}
</script>
</body>
</html>
